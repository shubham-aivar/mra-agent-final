[project]
name = "aivar-mra-agent"
version = "0.8.1"
description = "A04 MRA Agent for Project Elevate (local-first, with a hosted API)"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "python-docx>=1.1", "python-pptx>=1.0", "pillow>=10.1"]

[project.optional-dependencies]
hosted = ["boto3>=1.34", "aws-cdk-lib>=2.170,<3", "constructs>=10,<11"]
dev = ["pytest>=8", "moto[s3]>=5", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E701", "E702", "SIM108", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/demo.py" = ["E501"]
